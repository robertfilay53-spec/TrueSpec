name: Build release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      # Actions are pinned to SHAs, not tags: a tag is mutable, a SHA is
      # not, so a compromised or re-pointed tag cannot silently change
      # what the release build runs. Re-pin with `gh api
      # repos/<owner>/<repo>/commits/v5 --jq .sha` when the action needs
      # an upgrade.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      # Gate the release on the test suite: a release must never ship from a
      # commit whose tests fail, even if CI was skipped or bypassed.
      # -f net10.0-windows: the test project is multi-targeted and the app
      # targets net10.0-windows on Windows; a bare `dotnet test` would fail
      # with NU1201 on the net10.0 leg.
      - name: Test
        run: dotnet test TrueSpec.sln --configuration Release --verbosity normal -f net10.0-windows

      - name: Publish portable exe
        run: dotnet publish src/TrueSpec.App/TrueSpec.App.csproj -p:PublishProfile=win-x64 -o publish

      # Inno Setup is pinned to 6.7.1, the version the release runners
      # carry: an unpinned install silently follows whatever the feed
      # serves next, and a major Inno Setup change could alter the
      # installer the release ships. 6.7.1 is the version verified in the
      # v2.0.1 release (run 43370949730).
      - name: Install Inno Setup
        run: choco install innosetup --version 6.7.1 --yes

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\TrueSpec.iss'

      # The zip name follows the release tag (v1.0.1 -> TrueSpec-1.0.1-...),
      # so a re-run for a new version never uploads a misnamed asset.
      # The installer name comes from installer/TrueSpec.iss AppVersion,
      # which must be bumped to the same version in the release commit.
      - name: Zip portable exe
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}" -replace '^v', ''
          # The portable zip must carry the TrueSpec.portable marker, so a
          # buyer who extracts it to a USB stick gets portable behaviour
          # (scans on the stick) instead of installed-app behaviour. The
          # release publish uses the win-x64 profile, which does not write
          # the marker, so it is created here before zipping.
          New-Item -Path publish\TrueSpec.portable -ItemType File | Out-Null
          Compress-Archive -Path publish\TrueSpec.App.exe, publish\TrueSpec.portable -DestinationPath "TrueSpec-$version-portable.zip" -CompressionLevel Optimal

      # Gate 6: every release ships SHA-256 checksums. Compute them here so
      # the release carries a verifiable SHA256SUMS.txt alongside the assets.
      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}" -replace '^v', ''
          $installer = Get-Item installer\Output\TrueSpecSetup-*.exe | Select-Object -First 1
          $zip = "TrueSpec-$version-portable.zip"
          $installerHash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          $zipHash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$installerHash  $($installer.Name)" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          "$zipHash  $zip" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii -Append
          Get-Content SHA256SUMS.txt

      - name: Upload assets to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ inputs.tag }}" -replace '^v', ''
          $installer = Get-Item installer\Output\TrueSpecSetup-*.exe | Select-Object -First 1
          gh release upload ${{ inputs.tag }} $installer.FullName "TrueSpec-$version-portable.zip" SHA256SUMS.txt --clobber
